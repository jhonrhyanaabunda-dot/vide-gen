# Local run of the render service:
#   docker compose up --build
# then set NEXT_PUBLIC_RENDER_BACKEND_URL=http://localhost:8000 in .env.local.

services:
  render:
    build: .
    # Comes back after a reboot or a Docker Desktop restart, so the local
    # backend is just there rather than something to remember to start.
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Set both in backend/.env (gitignored). Defaults keep local dev working.
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-http://localhost:3000}"
      # Required once the service is reachable from the internet (e.g. exposed
      # through a Tailscale Funnel) — otherwise anyone with the URL can queue
      # renders on this machine.
      RENDER_API_KEY: "${RENDER_API_KEY:-}"
      WORK_DIR: /data/jobs
      MAX_UPLOAD_MB: "1024"
      JOB_TTL_SECONDS: "3600"
      MAX_CONCURRENT_RENDERS: "1"
      FFMPEG_PRESET: veryfast
      MUSIC_PAD_MODE: silence
    volumes:
      # Job scratch space. Renders are large and short-lived; a named volume
      # keeps them off the image layer and out of the repo.
      - render-jobs:/data/jobs
    # A single render can use every core it's given; without a ceiling it will
    # starve anything else sharing the host.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

volumes:
  render-jobs:
